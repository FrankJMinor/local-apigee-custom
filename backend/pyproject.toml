[project]
name = "local-apigee-custom"
version = "1.0.0"
description = "backend simulator"

dependencies = [
    "django>=5.0",
    "djangorestframework",
    "django-cors-headers",
    "ruff",
    "pre-commit",
    "drf-spectacular",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"