<svg width="400px" height="400px" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de resplandor neón -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Marco exterior (Contenedor neón) -->
  <rect x="10" y="10" width="80" height="80" rx="12" 
        fill="none" 
        stroke="#00D1FF" 
        stroke-width="2.5" 
        filter="url(#neonGlow)" 
        opacity="0.9" />

  <!-- Icono interno: Estructura de extracción -->
  <g filter="url(#neonGlow)" stroke="#00D1FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Nodo de origen (Izquierda) -->
    <rect x="28" y="32" width="14" height="20" rx="3" />
    
    <!-- Nodo destino superior (Derecha) -->
    <rect x="55" y="28" width="18" height="14" rx="3" />
    
    <!-- Nodo destino inferior (Derecha) -->
    <rect x="55" y="58" width="18" height="14" rx="3" />
    
    <!-- Conector 1: Horizontal directo -->
    <path d="M42 35 H55" />
    
    <!-- Conector 2: Ramificación en 'L' -->
    <path d="M35 52 V65 H55" />
    
  </g>
</svg>
