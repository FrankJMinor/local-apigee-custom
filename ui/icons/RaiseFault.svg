<svg width="400px" height="400px" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Resplandor neón Cian (Mediación) -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Resplandor neón Rojo (Alerta/Fault) -->
    <filter id="errorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Marco exterior (Contenedor neón) -->
  <rect x="10" y="10" width="80" height="80" rx="12" 
        fill="none" 
        stroke="#00D1FF" 
        stroke-width="2.5" 
        filter="url(#neonGlow)" 
        opacity="0.9" />

  <!-- Línea de flujo principal -->
  <path d="M25 35 H75" 
        stroke="#00D1FF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        filter="url(#neonGlow)" />

  <!-- El punto de interrupción (Fault Trigger) -->
  <circle cx="62" cy="35" r="5" 
          fill="#FF4500" 
          filter="url(#errorGlow)" />

  <!-- Trayectoria del fallo (Flecha curva) -->
  <g filter="url(#neonGlow)" stroke="#00D1FF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 35 Q62 65 35 65" />
    <!-- Punta de la flecha -->
    <path d="M42 58 L35 65 L42 72" />
  </g>
</svg>
